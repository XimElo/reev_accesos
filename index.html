<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios REEV</title>

<!-- ✅ CSS externo (más pro) -->
<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>USUARIOS</h2>
</div>

  <button id="backBtn" class="back-btn" onclick="resetGerencia()" style="display:none;">
  🔙 Cambiar gerencia
  </button>

<div class="search-box">
  <select id="mecanicaFilter">
    <option value="">Todas las mecánicas</option>
    <option value="Resellers">Resellers</option>
    <option value="Sell Out">Sell Out</option>
    <option value="Sell In">Sell In</option>
  </select>

  <input type="text" id="search" placeholder="Buscar tienda o código...">
</div>
  
<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="search" placeholder="Buscar tienda o código...">
</div>

<!-- LOADING -->
<div id="loading" class="loading">Cargando datos...</div>

<!-- LIST -->
<div class="list" id="list"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>

    <p><b>Usuario:</b><br>
      <span id="modalUser"></span>
    </p>

    <p><b>Contraseña:</b><br>
      <span id="modalPass"></span>
    </p>
    <p>
  <b>Mecánica:</b><br>
  <span id="modalMecanica"></span>
</p>

<p>
  <b>Base CCs:</b><br>
  <span id="modalCC"></span>
</p>

<p>
  <b>Base ZYN:</b><br>
  <span id="modalZyn"></span>
</p>

    <button class="btn" onclick="copyData()">📋 Copiar</button>
    <button class="btn" onclick="closeModal()">Cerrar</button>
  </div>
</div>



<!-- GERENCIAS VISUAL -->
<div class="gerencias">

  <button onclick="selectGerencia('PUEBLA')">
    <span>🏪</span>
    Puebla
  </button>

  <button onclick="selectGerencia('MORELIA')">
    <span>📍</span>
    Morelia
  </button>

  <button onclick="selectGerencia('SURESTE')">
    <span>🌴</span>
    Sureste
  </button>

  <button onclick="selectGerencia('PENINSULA')">
    <span>🌊</span>
    Península
  </button>

</div>


<script>

let data = [];
let timeout;
let currentGerencia = "";

function loadAllData() {

  const files = [
    "data/puebla.json",
    "data/morelia.json",
    "data/sureste.json",
    "data/peninsula.json"
  ];

  document.getElementById("loading").innerText = "Buscando en todas las gerencias...";
  document.getElementById("loading").style.display = "block";

  Promise.all(files.map(file => fetch(file).then(res => res.json())))
    .then(results => {

      data = results.flat();

      document.getElementById("loading").style.display = "none";

      render(document.getElementById("search").value);
    });
}

document.addEventListener("DOMContentLoaded", () => {
  const files = [
    "data/puebla.json",
    "data/morelia.json",
    "data/sureste.json",
    "data/peninsula.json"
  ];
});
  
// ✅ SELECCIONAR GERENCIA
function selectGerencia(g) {

  currentGerencia = g;

  document.getElementById("backBtn").style.display = "block";
  document.getElementById("search").value = "";
  document.querySelector(".header h2").innerText =
  "USUARIOS - " + g;

  
  // mostrar loading
  document.getElementById("loading").innerText = "Cargando " + g + "...";
  document.getElementById("loading").style.display = "block";

  // mostrar UI
  document.getElementById("list").style.display = "block";
  document.querySelector(".gerencias").style.display = "none";

  // 🔥 FETCH REAL
  fetch(`data/${g.toLowerCase()}.json`)
    .then(res => res.json())
    .then(json => {

      data = json;

      document.getElementById("loading").style.display = "none";

      render();
    });

  // 🎨 header color
  const header = document.querySelector(".header");
  header.classList.remove("PUEBLA","MORELIA","SURESTE","PENINSULA");
  header.classList.add(g);
}
// ✅ RESET GERENCIA
function resetGerencia() {

  currentGerencia = "";
  data = [];
  list.innerHTML = "";

  // reset UI
  document.querySelector(".gerencias").style.display = "grid";
  document.getElementById("backBtn").style.display = "none";

  document.querySelector(".header h2").innerText = "USUARIOS";

  document.getElementById("search").value = "";
}


function highlight(text, search) {
  if (!search) return text;

  const regex = new RegExp(`(${search})`, "gi");

  return text.replace(regex, `<span class="hl">$1</span>`);
}
  
// ✅ RENDER

const list = document.getElementById("list");

function render(filter = "") {

  list.innerHTML = "";

  data
    .filter(d => {

      const gerenciaLimpia = d.gerencia
        .toUpperCase()
        .replace("GERENCIA ", "");

      return (
        (currentGerencia === "" || gerenciaLimpia === currentGerencia) &&
        (
          d.tienda.toLowerCase().includes(filter.toLowerCase()) ||
          d.code.toLowerCase().includes(filter.toLowerCase())
        )
      );
    })
    .slice(0, 80)
    .forEach(d => {

      list.innerHTML += `
        <div class="item" onclick="openModal('${d.tienda}','${d.user}','${d.pass}')">
          <div>
           <div class="code">${highlight(d.code, filter)}</div>
           <div class="tienda">${highlight(d.tienda, filter)}</div>
            <div class="estado">
              <span class="badge ${d.estado}">${d.estado}</span>
            </div>
          </div>
          <div class="arrow">›</div>
        </div>
      `;
    });
}

// ✅ BUSCADOR (SIN LAG)
document.getElementById("search").addEventListener("input", e => {
  render(e.target.value);
});


// ✅ MODAL
function openModal(tienda, user,pass,mecanica,cc, zyn) {

  document.getElementById("modal").style.display = "block";

  document.getElementById("modalTitle").innerText = tienda;
  document.getElementById("modalUser").innerText = user;
  document.getElementById("modalPass").innerText = pass;

  document.getElementById("modalMecanica").innerText = mecanica;
  document.getElementById("modalCC").innerText = cc;
  document.getElementById("modalZyn").innerText = zyn;
}



// ✅ CERRAR MODAL
document.getElementById("modal").onclick = function(e) {
  if (e.target.id === "modal") {
    closeModal();
  }
};

// 🔥 BUSCADOR GLOBAL (AL FINAL)
document.getElementById("search").addEventListener("input", e => {

  const value = e.target.value;

  clearTimeout(timeout);

  timeout = setTimeout(() => {

    // 🔥 si NO hay gerencia seleccionada
    if (currentGerencia === "") {

      // cargar todo solo una vez
      if (data.length === 0) {
        loadAllData();
      } else {
        render(value);
      }

    } else {
      render(value);
    }

  }, 250);
});


  document
  .getElementById("mecanicaFilter")
  .addEventListener("change", () => {

    render(
      document.getElementById("search").value
    );

});

  
// ✅ COPIAR
function copyData() {
  const text =
    "Usuario: " + document.getElementById("modalUser").innerText +
    "\nContraseña: " + document.getElementById("modalPass").innerText;

  navigator.clipboard.writeText(text);
  alert("Copiado ✅");
}

// ✅ CERRAR MODAL
document.getElementById("modal").onclick = function(e) {
  if (e.target.id === "modal") {
    closeModal();
  }
};

</script>
</body>
</html>
