<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios REEV</title>

<!-- ✅ CSS externo (más pro) -->
<link rel="stylesheet" href="css/styles.css">

</head>

<body>

<!-- HEADER -->
<div class="header">
  <h2>USUARIOS</h2>
</div>

  <button id="backBtn" class="back-btn" onclick="resetGerencia()" style="display:none;">
  🔙 Cambiar gerencia
  </button>
  
<!-- SEARCH -->
<div class="search-box">
  <input type="text" id="search" placeholder="Buscar tienda o código...">
</div>

<!-- LOADING -->
<div id="loading" class="loading">Cargando datos...</div>

<!-- LIST -->
<div class="list" id="list"></div>

<!-- MODAL -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="modalTitle"></h3>

    <p><b>Usuario:</b><br>
      <span id="modalUser"></span>
    </p>

    <p><b>Contraseña:</b><br>
      <span id="modalPass"></span>
    </p>

    <button class="btn" onclick="copyData()">📋 Copiar</button>
    <button class="btn" onclick="closeModal()">Cerrar</button>
  </div>
</div>



<!-- GERENCIAS VISUAL -->
<div class="gerencias">

  <button onclick="selectGerencia('PUEBLA')">
    <span>🏪</span>
    Puebla
  </button>

  <button onclick="selectGerencia('MORELIA')">
    <span>📍</span>
    Morelia
  </button>

  <button onclick="selectGerencia('SURESTE')">
    <span>🌴</span>
    Sureste
  </button>

  <button onclick="selectGerencia('PENINSULA')">
    <span>🌊</span>
    Península
  </button>

</div>



<script>
let data = [];
let timeout;
let currentGerencia = "";


// ✅ SELECCIONAR GERENCIA
function selectGerencia(g) {

  currentGerencia = g;

  document.getElementById("backBtn").style.display = "block";
  document.getElementById("backBtn").style.display = "none";
  document.getElementById("search").value = "";
  document.querySelector(".header h2").innerText =
  "USUARIOS - " + g;

  
  // mostrar loading
  document.getElementById("loading").innerText = "Cargando " + g + "...";
  document.getElementById("loading").style.display = "block";

  // mostrar UI
  document.getElementById("searchBox").style.display = "block";
  document.getElementById("list").style.display = "block";
  document.querySelector(".gerencias").style.display = "none";

  // 🔥 FETCH REAL
  fetch(`data/${g.toLowerCase()}.json`)
    .then(res => res.json())
    .then(json => {

      data = json;

      document.getElementById("loading").style.display = "none";

      render();
    });

  // 🎨 header color
  const header = document.querySelector(".header");
  header.classList.remove("PUEBLA","MORELIA","SURESTE","PENINSULA");
  header.classList.add(g);
}
// ✅ RESET GERENCIA
function resetGerencia() {
  currentGerencia = "";
  data = [];
  list.innerHTML = "";

  document.querySelector(".gerencias").style.display = "grid";
  document.getElementById("searchBox").style.display = "none";
  document.getElementById("list").style.display = "none";
}


// ✅ RENDER
const list = document.getElementById("list");

function render(filter = "") {

  list.innerHTML = "";

  data
    .filter(d => {

      const gerenciaLimpia = d.gerencia
        .toUpperCase()
        .replace("GERENCIA ", "");

      return (
        (currentGerencia === "" || gerenciaLimpia === currentGerencia) &&
        (
          d.tienda.toLowerCase().includes(filter.toLowerCase()) ||
          d.code.toLowerCase().includes(filter.toLowerCase())
        )
      );
    })
    .slice(0, 80)
    .forEach(d => {

      list.innerHTML += `
        <div class="item" onclick="openModal('${d.tienda}','${d.user}','${d.pass}')">
          <div>
            <div class="code">${d.code}</div>
            <div class="tienda">${d.tienda}</div>
            <div class="estado">
              <span class="badge ${d.estado}">${d.estado}</span>
            </div>
          </div>
          <div class="arrow">›</div>
        </div>
      `;
    });
}

// ✅ BUSCADOR (SIN LAG)
document.getElementById("search").addEventListener("input", e => {

  clearTimeout(timeout);

  timeout = setTimeout(() => {
    render(e.target.value);
  }, 250);
});

// ✅ MODAL
function openModal(tienda, user, pass) {
  document.getElementById("modal").style.display = "block";
  document.getElementById("modalTitle").innerText = tienda;
  document.getElementById("modalUser").innerText = user;
  document.getElementById("modalPass").innerText = pass;
}

function closeModal() {
  document.getElementById("modal").style.display = "none";
}

// ✅ COPIAR
function copyData() {
  const text =
    "Usuario: " + document.getElementById("modalUser").innerText +
    "\nContraseña: " + document.getElementById("modalPass").innerText;

  navigator.clipboard.writeText(text);
  alert("Copiado ✅");
}

// ✅ CERRAR MODAL
document.getElementById("modal").onclick = function(e) {
  if (e.target.id === "modal") {
    closeModal();
  }
};

</script>
</body>
</html>
