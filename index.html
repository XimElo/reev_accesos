<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios REEV</title>
<link rel="stylesheet" href="css/styles.css">
<style>
.bases-info {
   font-size: 0.85rem;
   margin-top: 4px;
   color: #555;
}
.badge-base {
   background-color: #e2e8f0;
   padding: 2px 6px;
   border-radius: 4px;
   font-weight: bold;
   margin-right: 5px;
}
.badge-mecanica {
   background-color: #dbeafe;
   color: #1e40af;
   padding: 2px 6px;
   border-radius: 4px;
   font-size: 0.75rem;
   font-weight: bold;
}
.mecanica-filters {
   display: flex;
   gap: 8px;
   overflow-x: auto;
   padding: 10px 0;
   margin-bottom: 10px;
}
.mecanica-filters button {
   padding: 6px 12px;
   border: 1px solid #cbd5e1;
   border-radius: 20px;
   background: #fff;
   cursor: pointer;
   white-space: nowrap;
}
.mecanica-filters button.active {
   background: #2563eb;
   color: #fff;
   border-color: #2563eb;
}
</style>
</head>
<body>
<!-- HEADER -->
<div class="header">
<h2>USUARIOS</h2>
</div>
<button id="backBtn" class="back-btn" onclick="resetGerencia()" style="display:none;"> 🔙 Cambiar gerencia </button>
<!-- SEARCH -->
<div class="search-box">
<input type="text" id="search" placeholder="Buscar tienda o código...">
</div>

<!-- FILTROS DE MECÁNICA -->
<div id="mecanicaFiltersContainer" class="mecanica-filters" style="display:none;">

    <button data-mec="" class="active">
        Todas
    </button>

    <button data-mec="Resellers">
        Resellers
    </button>

    <button data-mec="ZYN + CCs">
        ZYN + CCs
    </button>

</div>
<!-- LOADING -->
<div id="loading" class="loading">Cargando datos...</div>
<!-- LIST -->
<div class="list" id="list"></div>
<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalTitle"></h3>
<p><b>Usuario:</b><br> <span id="modalUser"></span></p>
<p><b>Contraseña:</b><br> <span id="modalPass"></span></p>
<p id="modalBases" class="bases-info"></p>
<button class="btn" onclick="copyData()">📋 Copiar</button>
<button class="btn" onclick="closeModal()">Cerrar</button>
</div>
</div>
   
<!-- GERENCIAS VISUAL -->
<button class="gerenciaBtn" data-gerencia="PUEBLA">
    🏪 Puebla
</button>

<button class="gerenciaBtn" data-gerencia="MORELIA">
    📍 Morelia
</button>

<button class="gerenciaBtn" data-gerencia="SURESTE">
    🌴 Sureste
</button>

<button class="gerenciaBtn" data-gerencia="PENINSULA">
    🌊 Península
</button>

   document.querySelectorAll(".gerenciaBtn")
.forEach(btn => {

    btn.addEventListener("click", () => {

        selectGerencia(btn.dataset.gerencia);

    });

});

   
<script>
let data = [];
let timeout;
let currentGerencia = "";
let currentMecanica = "";
// Cargar global si buscan sin seleccionar gerencia
function loadAllData() {
   const files = [ "data/puebla.json", "data/morelia.json", "data/sureste.json", "data/peninsula.json" ];
   document.getElementById("loading").innerText = "Buscando en todas las gerencias...";
   document.getElementById("loading").style.display = "block";
   Promise.all(files.map(file => fetch(file).then(res => res.json())))
   .then(results => {
       data = results.flat();
       document.getElementById("loading").style.display = "none";
       render(document.getElementById("search").value);
   })
   .catch(err => {
       console.error("Error al cargar archivos:", err);
       document.getElementById("loading").innerText = "Error al cargar los datos.";
   });
}
// SELECCIONAR GERENCIA
function selectGerencia(g) {
   currentGerencia = g;
   currentMecanica = "";
   document.getElementById("backBtn").style.display = "block";
   document.getElementById("search").value = "";
   document.querySelector(".header h2").innerText = "USUARIOS - " + g;
   document.getElementById("mecanicaFiltersContainer").style.display = "flex";
   setActiveMecanicaBtn("");
   document.getElementById("loading").innerText = "Cargando " + g + "...";
   document.getElementById("loading").style.display = "block";
   document.getElementById("list").style.display = "block";
   document.querySelector(".gerencias").style.display = "none";
   // Petición al JSON correspondiente a la gerencia
   fetch(`data/${g.toLowerCase()}.json`)
   .then(res => res.json())
   .then(json => {
       data = json;
       document.getElementById("loading").style.display = "none";
       render();
   })
   .catch(err => {
       console.error("Error al cargar gerencia:", err);
       document.getElementById("loading").innerText = `No se encontró el archivo data/${g.toLowerCase()}.json`;
   });
   const header = document.querySelector(".header");
   header.classList.remove("PUEBLA","MORELIA","SURESTE","PENINSULA");
   header.classList.add(g);
}
// ✅ RESET GERENCIA
function resetGerencia() {
   currentGerencia = "";
   currentMecanica = "";
   data = [];
   list.innerHTML = "";
   document.querySelector(".gerencias").style.display = "grid";
   document.getElementById("backBtn").style.display = "none";
   document.getElementById("mecanicaFiltersContainer").style.display = "none";
   document.querySelector(".header h2").innerText = "USUARIOS";
   document.getElementById("search").value = "";
}
// ✅ FILTRAR POR MECÁNICA
function filterMecanica(mecanica) {
   currentMecanica = mecanica;
   setActiveMecanicaBtn(mecanica);
   render(document.getElementById("search").value);
}
function setActiveMecanicaBtn(mecanica) {
   document.querySelectorAll(".mecanica-filters button").forEach(btn => btn.classList.remove("active"));
   if (mecanica === "") {
       document.getElementById("btnMecAll").classList.add("active");
   } else if (mecanica === "Resellers") {
       document.getElementById("btnMecResellers").classList.add("active");
   } else if (mecanica === "ZYN + CC's") {
       document.getElementById("btnMecZynCC").classList.add("active");
   }
}
function highlight(text, search) {
   if (!search) return text;
   const regex = new RegExp(`(${search})`, "gi");
   return text.replace(regex, `<span class="hl">$1</span>`);
}
// ✅ RENDER
const list = document.getElementById("list");
function render(filter = "") {
   list.innerHTML = "";
   const filteredData = data.filter(d => {
       const matchBusqueda = (d.tienda && d.tienda.toLowerCase().includes(filter.toLowerCase())) ||
                             (d.code && d.code.toLowerCase().includes(filter.toLowerCase()));
       const matchMecanica = (currentMecanica === "" || d.MECANICA === currentMecanica);
       return matchBusqueda && matchMecanica;
   });
   filteredData.slice(0, 80).forEach(d => {

    list.innerHTML += `
        <div class="item"
            onclick="openModal(
                '${d.tienda}',
                '${d.user}',
                '${d.pass}',
                '${d.MECANICA}',
                '${d["BASE CCs"]}',
                '${d["BASE ZYN"]}'
            )">

            <div>

                <div class="code">
                    ${highlight(d.code, filter)}
                </div>

                <div class="tienda">
                    ${highlight(d.tienda, filter)}
                </div>

                <div class="mecanica">
                    🏷️ ${d.MECANICA || ""}
                </div>

            </div>

            <div class="arrow">›</div>

        </div>
    `;
});
}
// ✅ BUSCADOR
document.getElementById("search").addEventListener("input", e => {
   const value = e.target.value;
   clearTimeout(timeout);
   timeout = setTimeout(() => {
       if (currentGerencia === "") {
           if (data.length === 0) { loadAllData(); } else { render(value); }
       } else {
           render(value);
       }
   }, 250);
});
// ✅ MODAL
function openModal(tienda,user,pass,mecanica,baseCCs,baseZyn) {

    document.getElementById("modal").style.display = "block";

    document.getElementById("modalTitle").innerText = tienda;
    document.getElementById("modalUser").innerText = user;
    document.getElementById("modalPass").innerText = pass;

    document.getElementById("modalBases").innerHTML = `
        <b>Mecánica:</b> ${mecanica}<br><br>

        <b>Base CCs:</b> ${baseCCs}<br>

        <b>Base ZYN:</b> ${baseZyn}
    `;
}
function closeModal() {
   document.getElementById("modal").style.display = "none";
}
document.getElementById("modal").onclick = function(e) {
   if (e.target.id === "modal") { closeModal(); }
};
// ✅ COPIAR
function copyData() {
   const text = "Usuario: " + document.getElementById("modalUser").innerText + "\nContraseña: " + document.getElementById("modalPass").innerText;
   navigator.clipboard.writeText(text);
   alert("Copiado ✅");
}
</script>
</body>
</html>
