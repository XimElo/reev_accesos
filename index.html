<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios REEV</title>
<!-- ✅ CSS externo (más pro) -->
<link rel="stylesheet" href="css/styles.css">
<style>
/* Estilos rápidos para las bases y filtros de mecánica (puedes moverlos a tu CSS) */
.bases-info {
   font-size: 0.85rem;
   margin-top: 4px;
   color: #555;
}
.badge-base {
   background-color: #e2e8f0;
   padding: 2px 6px;
   border-radius: 4px;
   font-weight: bold;
   margin-right: 5px;
}
.badge-mecanica {
   background-color: #dbeafe;
   color: #1e40af;
   padding: 2px 6px;
   border-radius: 4px;
   font-size: 0.75rem;
   font-weight: bold;
}
.mecanica-filters {
   display: flex;
   gap: 8px;
   overflow-x: auto;
   padding: 10px 0;
   margin-bottom: 10px;
}
.mecanica-filters button {
   padding: 6px 12px;
   border: 1px solid #cbd5e1;
   border-radius: 20px;
   background: #fff;
   cursor: pointer;
   white-space: nowrap;
}
.mecanica-filters button.active {
   background: #2563eb;
   color: #fff;
   border-color: #2563eb;
}
</style>
</head>
<body>
<!-- HEADER -->
<div class="header">
<h2>USUARIOS</h2>
</div>
<button id="backBtn" class="back-btn" onclick="resetGerencia()" style="display:none;"> 🔙 Cambiar gerencia </button>
<!-- SEARCH -->
<div class="search-box">
<input type="text" id="search" placeholder="Buscar tienda o código...">
</div>
<!-- FILTROS DE MECÁNICA (Se muestran al seleccionar gerencia) -->
<div id="mecanicaFiltersContainer" class="mecanica-filters" style="display:none;">
<button onclick="filterMecanica('')" class="active" id="btnMecAll">Todas</button>
<button onclick="filterMecanica('Resellers')" id="btnMecResellers">Resellers</button>
<!-- Agrega más botones si tienes otras mecánicas, ej: Mayoreo, Detalle, etc. -->
</div>
<!-- LOADING -->
<div id="loading" class="loading">Cargando datos...</div>
<!-- LIST -->
<div class="list" id="list"></div>
<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalTitle"></h3>
<p><b>Usuario:</b><br> <span id="modalUser"></span></p>
<p><b>Contraseña:</b><br> <span id="modalPass"></span></p>
<p id="modalBases" class="bases-info"></p>
<button class="btn" onclick="copyData()">📋 Copiar</button>
<button class="btn" onclick="closeModal()">Cerrar</button>
</div>
</div>
<!-- GERENCIAS VISUAL -->
<div class="gerencias">
<button onclick="selectGerencia('PUEBLA')"> <span>🏪</span> Puebla </button>
<button onclick="selectGerencia('MORELIA')"> <span>📍</span> Morelia </button>
<button onclick="selectGerencia('SURESTE')"> <span>🌴</span> Sureste </button>
<button onclick="selectGerencia('PENINSULA')"> <span>🌊</span> Península </button>
</div>
<script>
let data = [];
let timeout;
let currentGerencia = "";
let currentMecanica = ""; // Variable para filtrar por mecánica
function loadAllData() {
   const files = [ "data/puebla.json", "data/morelia.json", "data/sureste.json", "data/peninsula.json" ];
   document.getElementById("loading").innerText = "Buscando in todas las gerencias...";
   document.getElementById("loading").style.display = "block";
   Promise.all(files.map(file => fetch(file).then(res => res.json())))
   .then(results => {
       data = results.flat();
       document.getElementById("loading").style.display = "none";
       render(document.getElementById("search").value);
   });
}
document.addEventListener("DOMContentLoaded", () => {
   const files = [ "data/puebla.json", "data/morelia.json", "data/sureste.json", "data/peninsula.json" ];
});
// ✅ SELECCIONAR GERENCIA
function selectGerencia(g) {
   currentGerencia = g;
   currentMecanica = ""; // Resetear filtro de mecánica al cambiar de gerencia
   document.getElementById("backBtn").style.display = "block";
   document.getElementById("search").value = "";
   document.querySelector(".header h2").innerText = "USUARIOS - " + g;
   // Mostrar filtros de mecánica
   document.getElementById("mecanicaFiltersContainer").style.display = "flex";
   setActiveMecanicaBtn("");
   // Mostrar loading
   document.getElementById("loading").innerText = "Cargando " + g + "...";
   document.getElementById("loading").style.display = "block";
   // Mostrar UI
   document.getElementById("list").style.display = "block";
   document.querySelector(".gerencias").style.display = "none";
   // 🔥 FETCH REAL
   fetch(`data/${g.toLowerCase()}.json`)
   .then(res => res.json())
   .then(json => {
       data = json;
       document.getElementById("loading").style.display = "none";
       render();
   });
   // 🎨 header color
   const header = document.querySelector(".header");
   header.classList.remove("PUEBLA","MORELIA","SURESTE","PENINSULA");
   header.classList.add(g);
}
// ✅ RESET GERENCIA
function resetGerencia() {
   currentGerencia = "";
   currentMecanica = "";
   data = [];
   list.innerHTML = "";
   // reset UI
   document.querySelector(".gerencias").style.display = "grid";
   document.getElementById("backBtn").style.display = "none";
   document.getElementById("mecanicaFiltersContainer").style.display = "none";
   document.querySelector(".header h2").innerText = "USUARIOS";
   document.getElementById("search").value = "";
}
// ✅ FILTRAR POR MECÁNICA
function filterMecanica(mecanica) {
   currentMecanica = mecanica;
   setActiveMecanicaBtn(mecanica);
   render(document.getElementById("search").value);
}
function setActiveMecanicaBtn(mecanica) {
   document.querySelectorAll(".mecanica-filters button").forEach(btn => btn.classList.remove("active"));
   if (mecanica === "") {
       document.getElementById("btnMecAll").classList.add("active");
   } else if (mecanica === "Resellers") {
       document.getElementById("btnMecResellers").classList.add("active");
   }
}
function highlight(text, search) {
   if (!search) return text;
   const regex = new RegExp(`(${search})`, "gi");
   return text.replace(regex, `<span class="hl">$1</span>`);
}
// ✅ RENDER
const list = document.getElementById("list");
function render(filter = "") {
   list.innerHTML = "";
   data.filter(d => {
       const gerenciaLimpia = d.gerencia ? d.gerencia.toUpperCase().replace("GERENCIA ", "") : currentGerencia;
       // Validaciones de filtros (Gerencia, Búsqueda de texto y Mecánica)
       const matchGerencia = (currentGerencia === "" || gerenciaLimpia === currentGerencia);
       const matchBusqueda = (d.tienda.toLowerCase().includes(filter.toLowerCase()) || d.code.toLowerCase().includes(filter.toLowerCase()));
       const matchMecanica = (currentMecanica === "" || d.MECANICA === currentMecanica);
       return matchGerencia && matchBusqueda && matchMecanica;
   })
   .slice(0, 80)
   .forEach(d => {
       // Asegurarnos de leer las propiedades de bases con seguridad (por si varían en minúsculas/mayúsculas)
       const baseCCs = d["BASE CCs"] || d.baseCCs || "0";
       const baseZyn = d["BASE ZYN"] || d.baseZyn || "0";
       const mecanicaVal = d.MECANICA || "General";
       list.innerHTML += `
<div class="item" onclick="openModal('${d.tienda}','${d.user}','${d.pass}','${baseCCs}','${baseZyn}','${mecanicaVal}')">
<div>
<div class="code">${highlight(d.code, filter)}</div>
<div class="tienda">${highlight(d.tienda, filter)}</div>
<div class="bases-info">
<span class="badge-mecanica">${mecanicaVal}</span>
                       📦 CCs: <span class="badge-base">${baseCCs}</span>
                       ⚡ ZYN: <span class="badge-base">${baseZyn}</span>
</div>
<div class="estado" style="margin-top: 4px;">
<span class="badge ${d.estado}">${d.estado}</span>
</div>
</div>
<div class="arrow">›</div>
</div>
       `;
   });
}
// ✅ BUSCADOR (SIN LAG)
document.getElementById("search").addEventListener("input", e => {
   const value = e.target.value;
   clearTimeout(timeout);
   timeout = setTimeout(() => {
       if (currentGerencia === "") {
           if (data.length === 0) { loadAllData(); } else { render(value); }
       } else {
           render(value);
       }
   }, 250);
});
// ✅ MODAL
function openModal(tienda, user, pass, baseCCs, baseZyn, mecanica) {
   document.getElementById("modal").style.display = "block";
   document.getElementById("modalTitle").innerText = tienda;
   document.getElementById("modalUser").innerText = user;
   document.getElementById("modalPass").innerText = pass;
   document.getElementById("modalBases").innerHTML = `<b>Mecánica:</b> ${mecanica}<br><b>BASE CCs:</b> ${baseCCs} | <b>BASE ZYN:</b> ${baseZyn}`;
}
function closeModal() {
   document.getElementById("modal").style.display = "none";
}
// ✅ CERRAR MODAL
document.getElementById("modal").onclick = function(e) {
   if (e.target.id === "modal") { closeModal(); }
};
// ✅ COPIAR
function copyData() {
   const text = "Usuario: " + document.getElementById("modalUser").innerText + "\nContraseña: " + document.getElementById("modalPass").innerText;
   navigator.clipboard.writeText(text);
   alert("Copiado ✅");
}
</script>
</body>
</html>
