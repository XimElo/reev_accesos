<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuarios REEV</title>
<link rel="stylesheet" href="css/styles.css">
<style>
.bases-info {
   font-size: 0.85rem;
   margin-top: 4px;
   color: #555;
}
.badge-base {
   background-color: #e2e8f0;
   padding: 2px 6px;
   border-radius: 4px;
   font-weight: bold;
   margin-right: 5px;
}
.badge-mecanica {
   background-color: #dbeafe;
   color: #1e40af;
   padding: 2px 6px;
   border-radius: 4px;
   font-size: 0.75rem;
   font-weight: bold;
}
.mecanica-filters {
   display: flex;
   gap: 8px;
   overflow-x: auto;
   padding: 10px 0;
   margin-bottom: 10px;
}
.mecanica-filters button {
   padding: 6px 12px;
   border: 1px solid #cbd5e1;
   border-radius: 20px;
   background: #fff;
   cursor: pointer;
   white-space: nowrap;
}
.mecanica-filters button.active {
   background: #2563eb;
   color: #fff;
   border-color: #2563eb;
}
</style>
</head>
<body>
<!-- HEADER -->
<div class="header">
<h2>USUARIOS</h2>
</div>
<button id="backBtn" class="back-btn" onclick="resetGerencia()" style="display:none;"> 🔙 Cambiar gerencia </button>
<!-- SEARCH -->
<div class="search-box">
<input type="text" id="search" placeholder="Buscar tienda o código...">
</div>

<!-- FILTROS DE MECÁNICA -->
<div
id="mecanicaFiltersContainer"
class="mecanica-filters"
style="display:none;">
</div>
   
<!-- LOADING -->
<div id="loading" class="loading">Cargando datos...</div>
<!-- LIST -->
<div class="list" id="list"></div>
<!-- MODAL -->
<div class="modal" id="modal">
<div class="modal-content">
<h3 id="modalTitle"></h3>
<p><b>Usuario:</b><br> <span id="modalUser"></span></p>
<p><b>Contraseña:</b><br> <span id="modalPass"></span></p>
<p id="modalBases" class="bases-info"></p>
<button class="btn" onclick="copyData()">📋 Copiar</button>
<button class="btn" onclick="closeModal()">Cerrar</button>
</div>
</div>
   
<!-- GERENCIAS VISUAL -->
<button class="gerenciaBtn" data-gerencia="PUEBLA">
    🏪 Puebla
</button>

<button class="gerenciaBtn" data-gerencia="MORELIA">
    📍 Morelia
</button>

<button class="gerenciaBtn" data-gerencia="SURESTE">
    🌴 Sureste
</button>

<button class="gerenciaBtn" data-gerencia="PENINSULA">
    🌊 Península
</button>

   document.querySelectorAll(".gerenciaBtn")
.forEach(btn => {

    btn.addEventListener("click", () => {

        selectGerencia(btn.dataset.gerencia);

    });

});

   
<script>

let data = [];
let currentGerencia = "";
let currentMecanica = "";

const list = document.getElementById("list");

document.querySelectorAll(".gerencia-btn")
.forEach(btn => {

    btn.addEventListener("click", () => {

        selectGerencia(
            btn.dataset.gerencia
        );

    });

});

async function selectGerencia(gerencia){

    currentGerencia = gerencia;

    document.querySelector(".gerencias").style.display = "none";

    document.getElementById("backBtn").style.display = "block";

    document.getElementById("loading").style.display = "block";

    try{

        const response = await fetch(
            `data/${gerencia}.json`
        );

        data = await response.json();

        buildMecanicaFilters();

        render();

    }

    catch(error){

        alert(
            "No pude cargar data/" +
            gerencia +
            ".json"
        );

        console.error(error);

    }

    document.getElementById("loading").style.display = "none";

}

function buildMecanicaFilters(){

    const container =
    document.getElementById(
    "mecanicaFiltersContainer"
    );

    container.style.display = "flex";

    const mecanicas =
    [...new Set(
    data.map(d => d.MECANICA)
    )];

    container.innerHTML = "";

    const allBtn =
    document.createElement("button");

    allBtn.textContent = "Todas";

    allBtn.classList.add("active");

    allBtn.onclick = () => {

        currentMecanica = "";

        buildMecanicaFilters();

        render();

    };

    container.appendChild(allBtn);

    mecanicas.forEach(m => {

        const btn =
        document.createElement("button");

        btn.textContent = m;

        btn.onclick = () => {

            currentMecanica = m;

            buildMecanicaFilters();

            render();

        };

        if(currentMecanica===m){

            btn.classList.add("active");

        }

        container.appendChild(btn);

    });

}

function render(search=""){

    list.innerHTML="";

    const results = data.filter(d => {

        const busqueda =

        String(d.tienda)
        .toLowerCase()
        .includes(search.toLowerCase())

        ||

        String(d.code)
        .toLowerCase()
        .includes(search.toLowerCase());

        const mecanica =

        currentMecanica === ""

        ||

        d.MECANICA === currentMecanica;

        return busqueda && mecanica;

    });

    results.forEach(d => {

        const item =
        document.createElement("div");

        item.className = "item";

        item.innerHTML = `

            <div>

                <div class="code">
                    ${d.code}
                </div>

                <div class="tienda">
                    ${d.tienda}
                </div>

                <div class="mecanica">
                    ${d.MECANICA}
                </div>

            </div>

            <div class="arrow">›</div>

        `;

        item.addEventListener("click",()=>{

            openModal(
                d.tienda,
                d.user,
                d.pass,
                d.MECANICA,
                d["BASE CCs"],
                d["BASE ZYN"]
            );

        });

        list.appendChild(item);

    });

}

document
.getElementById("search")
.addEventListener("input",(e)=>{

    render(e.target.value);

});

function openModal(
tienda,
user,
pass,
mecanica,
baseCC,
baseZyn
){

    document.getElementById("modal").style.display="block";

    document.getElementById("modalTitle").innerText=tienda;

    document.getElementById("modalUser").innerText=user;

    document.getElementById("modalPass").innerText=pass;

    document.getElementById("modalBases").innerHTML=

    `
    <b>Mecánica:</b> ${mecanica}<br><br>
    <b>Base CCs:</b> ${baseCC}<br>
    <b>Base ZYN:</b> ${baseZyn}
    `;

}

function closeModal(){

    document.getElementById("modal").style.display="none";

}

function copyData(){

    const texto =
    `Usuario: ${
    modalUser.innerText
    }\nContraseña: ${
    modalPass.innerText
    }`;

    navigator.clipboard.writeText(texto);

    alert("Copiado ✅");

}

function resetGerencia(){

    currentGerencia="";

    currentMecanica="";

    data=[];

    list.innerHTML="";

    document.querySelector(".gerencias").style.display="grid";

    document.getElementById("backBtn").style.display="none";

    document.getElementById("mecanicaFiltersContainer").style.display="none";

}

</script>
</body>
</html>
