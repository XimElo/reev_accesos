<!DOCTYPE html>
<html lang="es">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Usuarios REEV</title>

<link rel="stylesheet" href="css/styles.css">

<style>

.mecanica-filters{
    display:flex;
    gap:8px;
    overflow-x:auto;
    padding:10px;
}

.mecanica-filters button{
    padding:8px 12px;
    border:none;
    border-radius:20px;
    background:#e5e7eb;
    cursor:pointer;
}

.mecanica-filters button.active{
    background:#2563eb;
    color:white;
}

.bases-info{
    line-height:1.8;
}

</style>

</head>

<body>

<div class="header">
    <h2 id="titulo">USUARIOS</h2>
</div>

<button
id="backBtn"
class="back-btn"
style="display:none;"
onclick="resetGerencia()">
🔙 Cambiar gerencia
</button>

<div class="search-box">
    <input
    type="text"
    id="search"
    placeholder="Buscar tienda o código...">
</div>

<div
id="mecanicaFiltersContainer"
class="mecanica-filters"
style="display:none;">
</div>

<div id="loading" class="loading" style="display:none;">
    Cargando datos...
</div>

<div class="list" id="list"></div>

<div class="modal" id="modal">

    <div class="modal-content">

        <h3 id="modalTitle"></h3>

        <p>
            <b>Usuario:</b><br>
            <span id="modalUser"></span>
        </p>

        <p>
            <b>Contraseña:</b><br>
            <span id="modalPass"></span>
        </p>

        <p id="modalBases" class="bases-info"></p>

        <button class="btn" onclick="copyData()">
            📋 Copiar
        </button>

        <button class="btn" onclick="closeModal()">
            Cerrar
        </button>

    </div>

</div>

<div class="gerencias" id="gerencias">

    <button onclick="selectGerencia('puebla')">
        <span>🏪</span>
        Puebla
    </button>

    <button onclick="selectGerencia('morelia')">
        <span>📍</span>
        Morelia
    </button>

    <button onclick="selectGerencia('sureste')">
        <span>🌴</span>
        Sureste
    </button>

    <button onclick="selectGerencia('peninsula')">
        <span>🌊</span>
        Península
    </button>

</div>

<script>

let data = [];
let currentMecanica = "";

const list = document.getElementById("list");

async function selectGerencia(gerencia){

    document.getElementById("loading").style.display = "block";

    document.getElementById("gerencias").style.display = "none";

    document.getElementById("backBtn").style.display = "block";

    document.getElementById("titulo").innerText =
        "USUARIOS - " + gerencia.toUpperCase();

    try{

        const response =
        await fetch(`data/${gerencia}.json`);

        data = await response.json();

        createFilters();

        render("");

    }
    catch(error){

        console.error(error);

        alert(
            "No se pudo cargar data/" +
            gerencia +
            ".json"
        );

    }

    document.getElementById("loading").style.display = "none";
}

function createFilters(){

    const container =
    document.getElementById(
    "mecanicaFiltersContainer"
    );

    container.style.display = "flex";

    const mecanicas =
    [...new Set(data.map(x => x.MECANICA))];

    container.innerHTML = "";

    const btnAll = document.createElement("button");

    btnAll.innerText = "Todas";

    btnAll.classList.add("active");

    btnAll.onclick = () => {

        currentMecanica = "";

        createFilters();

        render(
            document.getElementById("search").value
        );
    };

    container.appendChild(btnAll);

    mecanicas.forEach(mec => {

        const btn =
        document.createElement("button");

        btn.innerText = mec;

        if(currentMecanica === mec){

            btn.classList.add("active");

        }

        btn.onclick = () => {

            currentMecanica = mec;

            createFilters();

            render(
                document.getElementById("search").value
            );

        };

        container.appendChild(btn);

    });

}

function render(search){

    list.innerHTML = "";

    const result = data.filter(d => {

        const coincideBusqueda =

            String(d.tienda)
            .toLowerCase()
            .includes(search.toLowerCase())

            ||

            String(d.code)
            .toLowerCase()
            .includes(search.toLowerCase());

        const coincideMecanica =

            currentMecanica === ""

            ||

            d.MECANICA === currentMecanica;

        return coincideBusqueda &&
               coincideMecanica;

    });

    result.forEach(d => {

        const div =
        document.createElement("div");

        div.className = "item";

        div.innerHTML = `
            <div>
                <div class="code">${d.code}</div>
                <div class="tienda">${d.tienda}</div>
                <div class="mecanica">${d.MECANICA}</div>
            </div>

            <div class="arrow">›</div>
        `;

        div.onclick = () => {

            openModal(
                d.tienda,
                d.user,
                d.pass,
                d.MECANICA,
                d["BASE CCs"],
                d["BASE ZYN"]
            );

        };

        list.appendChild(div);

    });

}

document
.getElementById("search")
.addEventListener("input", e => {

    render(e.target.value);

});

function openModal(
tienda,
user,
pass,
mecanica,
baseCCs,
baseZYN
){

    document.getElementById("modal").style.display = "block";

    document.getElementById("modalTitle").innerText = tienda;

    document.getElementById("modalUser").innerText = user;

    document.getElementById("modalPass").innerText = pass;

    document.getElementById("modalBases").innerHTML = `
        <b>Mecánica:</b> ${mecanica}<br><br>
        <b>Base CCs:</b> ${baseCCs}<br>
        <b>Base ZYN:</b> ${baseZYN}
    `;

}

function closeModal(){

    document.getElementById("modal").style.display = "none";

}

function copyData(){

    const texto =
`Usuario: ${document.getElementById("modalUser").innerText}
Contraseña: ${document.getElementById("modalPass").innerText}`;

    navigator.clipboard.writeText(texto);

    alert("Copiado ✅");

}

function resetGerencia(){

    currentGerencia="";

    currentMecanica="";

    data=[];

    list.innerHTML="";

    document.querySelector(".gerencias").style.display="grid";

    document.getElementById("backBtn").style.display="none";

    document.getElementById("mecanicaFiltersContainer").style.display="none";

}


</script>
</body>
</html>
